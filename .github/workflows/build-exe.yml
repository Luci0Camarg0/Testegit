name: Gerar exe para Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps rapidocr_onnxruntime==1.4.4

      - name: Baixar modelos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx -OutFile models/face_detection_yunet_2023mar.onnx
          Invoke-WebRequest https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx -OutFile models/face_recognition_sface_2021dec.onnx

      - name: Baixar leitor de letra de mao (PP-OCRv6)
        run: |
          python -m pip download --no-deps rapidocr==3.10.0 -d ocrdl
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('ocrdl/rapidocr-*.whl')[0]); open('models/PP-OCRv6_rec_small.onnx','wb').write(z.read('rapidocr/models/PP-OCRv6_rec_small.onnx'))"

      - name: Conferir numero da versao
        shell: pwsh
        run: |
          $j = Get-Content versao.json -Raw | ConvertFrom-Json
          $m = Select-String -Path reconhecimento.py -Pattern '^VERSAO\s*=\s*(\d+)'
          $v = [int]$m.Matches[0].Groups[1].Value
          Write-Output "versao.json=$($j.versao) reconhecimento.py=$v"
          if ($j.versao -ne $v) { Write-Error "versao.json e VERSAO diferentes"; exit 1 }

      - name: Gerar exe
        run: pyinstaller --noconfirm --onefile --windowed --name ReconhecimentoFacial --add-data "models;models" --add-data "assets;assets" --icon assets/icone.ico --collect-all rapidocr_onnxruntime --hidden-import csv --hidden-import zipfile --hidden-import hashlib --hidden-import datetime --hidden-import statistics --hidden-import concurrent.futures --hidden-import webbrowser --hidden-import tkinter.simpledialog --hidden-import tkinter.colorchooser --hidden-import PIL.ImageOps --hidden-import PIL.ImageDraw --hidden-import PIL.ImageFilter --hidden-import PIL.ImageFont --hidden-import PIL.ExifTags iniciar.py

      - name: Testar o exe (modelos de rosto e leitor de fichas)
        shell: pwsh
        run: |
          Start-Process -FilePath dist/ReconhecimentoFacial.exe -ArgumentList "--autoteste" -Wait
          $r = Get-Content dist/autoteste.txt
          Write-Output $r
          if (-not $r.StartsWith("ok")) { exit 1 }
          if (-not $r.Contains("mao=sim")) { Write-Error "leitor de letra de mao nao foi junto"; exit 1 }
          if ($r.Contains("nomes=sem")) { Write-Error "conferencia dos nomes com o dicionario nao funcionou"; exit 1 }
          Remove-Item dist/autoteste.txt

      - name: Testar o reiniciar depois de atualizar
        timeout-minutes: 4
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/ReconhecimentoFacial.exe -ArgumentList "--autoteste-reinicio" -PassThru
          $null = $p.WaitForExit(60000)
          for ($i = 0; $i -lt 90 -and -not (Test-Path dist/autoteste.txt); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          if (-not (Test-Path dist/autoteste.txt)) { Write-Error "o programa nao reabriu"; exit 1 }
          $r = Get-Content dist/autoteste.txt
          Write-Output $r
          if (-not $r.StartsWith("ok")) { exit 1 }
          Remove-Item dist/autoteste.txt

      - name: Testar a janela (galeria, foto grande, mover e desfazer)
        timeout-minutes: 4
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/ReconhecimentoFacial.exe -ArgumentList "--autoteste-janela" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "a janela travou"; exit 1 }
          $r = Get-Content dist/autoteste_janela.txt -Raw
          Write-Output $r
          if (Test-Path dist/erros.txt) { Get-Content dist/erros.txt }
          if (-not $r.StartsWith("ok")) { exit 1 }
          Remove-Item dist/autoteste_janela.txt

      - name: Testar a atualizacao nos .exe antigos que o usuario pode ter
        timeout-minutes: 12
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $falhou = $false
          # versao 6 (primeira com atualizacao), 8 e 10 (com o leitor de letra de mao)
          foreach ($run in @("40175592752", "40177608006", "40215438671")) {
            $d = "old_$run"
            gh run download $run -n ReconhecimentoFacial -D $d
            if ($LASTEXITCODE -ne 0) { Write-Output "sem o .exe da execucao $run"; $global:LASTEXITCODE = 0; continue }
            New-Item -ItemType Directory -Force "$d/atualizacao" | Out-Null
            Copy-Item reconhecimento.py "$d/atualizacao/reconhecimento.py"
            $p = Start-Process -FilePath "$d/ReconhecimentoFacial.exe" -ArgumentList "--autoteste-janela" -PassThru
            if (-not $p.WaitForExit(150000)) { $p.Kill() }
            Start-Sleep 2
            $r = if (Test-Path "$d/autoteste_janela.txt") { Get-Content "$d/autoteste_janela.txt" -Raw } else { "sem resultado" }
            Write-Output "exe da execucao ${run}: $r"
            if (Test-Path "$d/erros.txt") { Get-Content "$d/erros.txt" }
            if (Test-Path "$d/atualizacao/reconhecimento.py.com_erro") { Write-Output "a atualizacao foi descartada" }
            if (-not $r.StartsWith("ok")) { $falhou = $true }
          }
          if ($falhou) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ReconhecimentoFacial
          path: dist/ReconhecimentoFacial.exe

      - name: Publicar o leitor de letra de mao (para quem tem o .exe antigo)
        if: github.ref == 'refs/heads/reconhecimento-facial'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view modelos *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create modelos models/PP-OCRv6_rec_small.onnx --target $env:GITHUB_SHA --title "Modelos" --notes "Arquivos baixados pelo programa quando precisa."
          }
          $global:LASTEXITCODE = 0

      - name: Publicar link fixo de download (release "ultima")
        if: github.ref == 'refs/heads/reconhecimento-facial'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima -y --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create ultima dist/ReconhecimentoFacial.exe --target $env:GITHUB_SHA --title "Reconhecimento Facial (ultima versao)" --notes "Baixe o ReconhecimentoFacial.exe abaixo. Depois de instalado, o programa se atualiza sozinho."
