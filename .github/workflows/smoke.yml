name: Testar no emulador

on:
  workflow_dispatch:
  push:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.galeria.app android.permission.READ_MEDIA_IMAGES || true
            adb shell pm grant com.galeria.app android.permission.READ_MEDIA_VIDEO || true
            adb shell pm grant com.galeria.app android.permission.READ_MEDIA_AUDIO || true
            adb logcat -c
            adb shell am start -W -n com.galeria.app/.MainActivity
            sleep 15
            adb shell input tap 540 2280 ; sleep 3
            adb shell input tap 900 2280 ; sleep 3
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' > errors.txt || true
            adb exec-out screencap -p > tela.png || true
            cat crash.txt
            test -n "$(adb shell pidof com.galeria.app)" && echo APP_VIVO || echo APP_MORREU
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-emulador
          path: |
            crash.txt
            errors.txt
            tela.png
